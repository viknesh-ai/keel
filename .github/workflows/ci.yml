name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "22"

jobs:
  verify:
    name: Lint, typecheck, boundaries, test, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Lint and format check
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Dependency boundaries
        run: pnpm boundaries

      - name: Unit tests
        run: pnpm test

      - name: Build
        run: pnpm build

  integration:
    name: Migrations and RLS against a real Postgres
    runs-on: ubuntu-latest

    # Same image as docker-compose.yml. RLS behaviour is version-sensitive and
    # the whole point of this job is to exercise the real engine, so testing
    # against anything else would defeat it.
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: keel
          POSTGRES_PASSWORD: keel
          POSTGRES_DB: keel
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U keel -d keel"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      DATABASE_URL: postgres://keel:keel@localhost:5432/keel

    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Migrations apply from an empty database
        run: pnpm migrate

      - name: Running them again is a no-op
        run: |
          output="$(pnpm migrate)"
          echo "$output"
          if ! grep -q "nothing to do" <<<"$output"; then
            echo "::error::Second migrate run was not a no-op."
            exit 1
          fi

      # Proves the checksum guard fires, rather than trusting that it would.
      - name: A tampered migration is rejected
        run: |
          cp migrations/0001_init.sql /tmp/0001_init.sql.orig
          printf '\n-- tampered\n' >> migrations/0001_init.sql
          if pnpm migrate; then
            echo "::error::Tampered migration was accepted."
            cp /tmp/0001_init.sql.orig migrations/0001_init.sql
            exit 1
          fi
          echo "Checksum guard fired as expected."
          cp /tmp/0001_init.sql.orig migrations/0001_init.sql

      - name: Integration tests (throwaway database per file)
        run: pnpm test:int

  rls-guard:
    name: RLS test is actually enforcing
    runs-on: ubuntu-latest

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: keel
          POSTGRES_PASSWORD: keel
          POSTGRES_DB: keel
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U keel -d keel"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      DATABASE_URL: postgres://keel:keel@localhost:5432/keel

    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      # A row-level security policy that looks correct and silently permits
      # everything is the failure mode this schema exists to prevent. Asserting
      # the tests pass does not prove they would notice; weakening a policy and
      # asserting they fail does.
      - name: Weaken one policy to USING (true)
        run: |
          perl -0pi -e 's/create policy projects_org_isolation on projects\n  as permissive for all to public\n  using      \(org_id = keel_current_org_id\(\)\)/create policy projects_org_isolation on projects\n  as permissive for all to public\n  using      (true)/' migrations/0001_init.sql
          if ! grep -q "using      (true)" migrations/0001_init.sql; then
            echo "::error::Mutation did not apply — the guard would have passed for the wrong reason. Update the pattern in this step to match 0001_init.sql."
            exit 1
          fi

      - name: Expect the RLS suite to fail
        run: |
          if pnpm test:int; then
            echo "::error::RLS suite passed against a USING (true) policy. The cross-org tests are not enforcing anything."
            exit 1
          fi
          echo "RLS suite caught the weakened policy, as expected."

  design-tokens:
    name: Token matrix is current and meets WCAG AA
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      # tokens.css is generated from tokens.ts. Regenerating and diffing catches
      # a stale stylesheet, which would mean the browser renders colours the
      # contrast check never verified.
      - name: tokens.css matches its generator
        run: |
          pnpm --filter @keel/ui build:tokens
          if ! git diff --quiet -- packages/ui/src/tokens.css; then
            echo "::error::packages/ui/src/tokens.css is stale. Run 'pnpm --filter @keel/ui build:tokens' and commit."
            git --no-pager diff -- packages/ui/src/tokens.css
            exit 1
          fi

      - name: Contrast and primitive tests
        run: pnpm --filter @keel/ui test

  contrast-guard:
    name: Contrast check is actually enforcing
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      # Same reasoning as boundary-guard and rls-guard: assert the gate fires.
      - name: Break one token pair
        run: |
          perl -pi -e 's/^  "text-secondary": "#a3adbb",$/  "text-secondary": "#3a4049",/' packages/ui/src/tokens.ts
          if ! grep -q '"text-secondary": "#3a4049"' packages/ui/src/tokens.ts; then
            echo "::error::Mutation did not apply — the guard would pass for the wrong reason. Update the pattern in this step."
            exit 1
          fi

      - name: Expect the contrast check to fail
        run: |
          if pnpm --filter @keel/ui test; then
            echo "::error::Contrast check passed against a token pair below 4.5:1. It is not enforcing."
            exit 1
          fi
          echo "Contrast check caught the regression, as expected."

  model-providers:
    name: Provider contract suite against a real Ollama
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      # The exit criterion is that the *same* contract suite passes against a
      # real backend, not a mock. A 0.5B model is enough to exercise the
      # adapter, which is what is under test — the model's answers are not.
      - name: Start Ollama and pull a small model
        run: |
          curl -fsSL https://ollama.com/install.sh | sh
          ollama serve > /tmp/ollama.log 2>&1 &
          for i in $(seq 1 30); do
            curl -sf http://localhost:11434/api/tags >/dev/null && break
            sleep 2
          done
          ollama pull qwen2.5:0.5b

      # The suite skips when Ollama is absent, which would make this job pass
      # vacuously. Assert it actually ran.
      - name: Contract suite must run, not skip
        run: |
          output="$(pnpm --filter @keel/model-providers test 2>&1)"
          echo "$output"
          if ! grep -q "ollama.test.ts" <<<"$output"; then
            echo "::error::The Ollama contract suite did not run."
            exit 1
          fi
          if grep -qE "ollama\.test\.ts.*skipped" <<<"$output"; then
            echo "::error::The Ollama contract suite was skipped — no live evidence was produced."
            exit 1
          fi

  openapi-tools:
    name: Generated tool contracts are current and disabled
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      # Generation is deterministic; a diff here means the spec changed and the
      # contracts were not regenerated, so the catalogue no longer describes the
      # API the agent would actually call.
      - name: Regenerating produces no diff
        run: |
          pnpm --filter @keel/tool-runtime generate
          if ! git diff --quiet -- apps/demo-saas/keel/tools; then
            echo "::error::Generated tool contracts are stale. Run 'pnpm --filter @keel/tool-runtime generate' and commit."
            git --no-pager diff -- apps/demo-saas/keel/tools
            exit 1
          fi

      # Default-deny on the artifact itself, not only in the generator's tests.
      - name: Nothing is enabled by default
        run: |
          if grep -q "enabled: true" apps/demo-saas/keel/tools/northwind.yaml; then
            echo "::error::A generated tool contract is enabled by default."
            grep -n -B4 "enabled: true" apps/demo-saas/keel/tools/northwind.yaml
            exit 1
          fi
          echo "All generated operations are disabled."

  bundle-size:
    name: Client bundle stays within budget
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      # Doc 05 §E6: @keel/client plus the widget core stays under 45 KB gzipped.
      # Checked now, while it is easy to stay under — widget weight is a tax on
      # the customer's Core Web Vitals and it is the first thing a serious
      # frontend team measures.
      - name: Measure
        run: pnpm --filter @keel/client size

  boundary-guard:
    name: Boundary rule is actually enforced
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      # Proves the rule works rather than trusting the config file.
      # Injects a forbidden import, asserts the check fails, then removes it.
      - name: Inject a forbidden packages/ -> services/ import
        run: |
          printf 'import "../../../services/api/src/index.js";\n' > packages/contracts/src/__boundary_probe.ts
      - name: Expect the boundary check to fail
        run: |
          if pnpm boundaries; then
            echo "::error::Boundary rule did not fire on a forbidden import."
            exit 1
          fi
          echo "Boundary rule fired as expected."
      - name: Clean up
        if: always()
        run: rm -f packages/contracts/src/__boundary_probe.ts
