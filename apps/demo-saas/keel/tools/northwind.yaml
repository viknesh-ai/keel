              placed_at:
                type: string
                format: "date-time"
              fulfilled_at:
                type:
                  - string
                  - "null"
                format: "date-time"
        page:
          type: object
          additionalProperties: false
          required:
            - next_cursor
            - has_more
          properties:
            next_cursor:
              type:
                - string
                - "null"
            has_more:
              type: boolean
  - operationId: login
    method: POST
    path: /api/auth/login
    enabled: false
    title: Start a staff session
    description: "Exchanges staff credentials for a session cookie. Used by the Northwind web UI. Not used by Keel, which authenticates with a bearer token."
    side_effect: write
    risk: high
    auth:
      kind: user_action_token
    timeout_ms: 30000
    idempotency:
      required: true
      key_from:
        - email
        - password
    input:
      type: object
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 1
      required:
        - email
        - password
      additionalProperties: false
    output:
      type: object
      additionalProperties: false
      required:
        - id
        - email
        - name
        - role
      properties:
        id:
          type: string
        email:
          type: string
          format: email
        name:
          type: string
        role:
          type: string
          enum:
            - owner
            - support
            - finance
            - readonly
  - operationId: logout
    method: POST
    path: /api/auth/logout
    enabled: false
    title: End the current staff session
    description: "Invalidates the session token server-side, not only the cookie."
    side_effect: write
    risk: high
    auth:
      kind: user_action_token
    timeout_ms: 30000
    idempotency:
      required: true
      key_from:
        - "*"
    input:
      type: object
      properties: {}
      additionalProperties: false
    output:
      type: object
      properties: {}
      additionalProperties: false
