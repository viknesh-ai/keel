tools:
  - operationId: cancelSubscription
    method: POST
    path: "/api/v1/customers/{customerId}/subscription/cancel"
    enabled: false
    title: "Cancel a customer's subscription"
    description: "Cancels the subscription, either at the end of the current billing period or immediately. Immediate cancellation ends access and is not reversible from this API, so it is the destructive form."
    side_effect: write
    risk: high
    auth:
      kind: user_action_token
    timeout_ms: 30000
    idempotency:
      required: true
      key_from:
        - customerId
        - when
    input:
      type: object
      properties:
        customerId:
          type: string
          pattern: "^cus_[0-9a-f]{24}$"
          description: "The customer's identifier."
        when:
          type: string
          enum:
            - period_end
            - immediately
          description: "`period_end` keeps access until the current period ends. `immediately` ends access now and cannot be undone here."
        reason:
          type: string
          maxLength: 500
      required:
        - customerId
        - when
      additionalProperties: false
    output:
      type: object
      additionalProperties: false
      required:
        - id
        - customer_id
        - plan
        - billing_interval
        - status
        - mrr
        - started_at
        - current_period_end
        - cancel_at_period_end
      properties:
        id:
          type: string
        customer_id:
          type: string
        plan:
          type: string
          enum:
            - free
            - starter
            - pro
            - enterprise
        billing_interval:
          type: string
          enum:
            - monthly
            - annual
        status:
          type: string
          enum:
            - active
            - trialing
            - past_due
            - cancelled
        mrr:
          type: object
          description: "An amount in minor units, with its currency. Never a float."
          additionalProperties: false
          required:
            - amount_minor
            - currency
          properties:
            amount_minor:
              type: integer
              description: "Amount in the currency's smallest unit, e.g. paise or cents."
            currency:
              type: string
              enum:
                - INR
                - USD
                - EUR
                - GBP
        started_at:
          type: string
          format: "date-time"
        current_period_end:
          type: string
          format: "date-time"
        cancel_at_period_end:
          type: boolean
        cancelled_at:
          type:
            - string
            - "null"
          format: "date-time"
    bind:
      "header.Idempotency-Key": runtime.idempotency_key
