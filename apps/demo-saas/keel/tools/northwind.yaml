            - trial
            - churned
            - suspended
          description: Restrict to a single customer status.
        inactive_days:
          type: integer
          minimum: 1
          maximum: 3650
          description: "Return only customers whose last login is older than this many days, or who have never logged in."
        plan:
          type: string
          enum:
            - free
            - starter
            - pro
            - enterprise
          description: Restrict to customers on a given subscription plan.
        q:
          type: string
          maxLength: 200
          description: "Case-insensitive substring match on name, company or email."
        limit:
          type: integer
          minimum: 1
          maximum: 100
          default: 25
          description: Maximum items to return.
        cursor:
          type: string
          maxLength: 200
          description: "Opaque cursor from the previous page's `next_cursor`."
      additionalProperties: false
    output:
      type: object
      additionalProperties: false
      required:
        - data
        - page
      properties:
